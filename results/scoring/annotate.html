<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer annotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --paper: #F6F4F0; --surface: #FFFFFF; --ink: #1D2433; --muted: #5B6475; --faint: #8A93A3;
  --line: #DDD6CA; --pen: #C78E3F; --pen-ink: #8E6224; --pen-soft: #F9F4EB; --pen-line: #EAD9BC; --mark: #F1D7A8;
  --ok: #23855A; --ok-soft: #E3F3EA; --warn: #B8462E; --warn-soft: #FBEAE5;
  --ui: "Public Sans", "Segoe UI", system-ui, sans-serif; --bar: 48px;
  --read: "Source Serif 4", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--ui); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
*:focus, *:focus-visible { outline: none; box-shadow: none; }
.hidden { display: none !important; }

/* top bar */
.bar { flex: none; position: relative; z-index: 5; display: flex; align-items: center; gap: 10px; height: var(--bar); padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 15px; margin: 0; font-weight: 700; white-space: nowrap; }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crumb .sep { color: var(--faint); }
.crumb .here { font-weight: 700; }
.back { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; }
.back:hover { background: var(--paper); border-color: var(--faint); }
.back svg { flex: none; }
.iconbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); }
.iconbtn:hover, .iconbtn[aria-expanded="true"] { background: var(--paper); border-color: var(--line); color: var(--ink); }
.bar .grow { flex: 1; }
.search { position: relative; display: flex; align-items: center; height: 34px; }
.search input { width: 0; opacity: 0; padding: 6px 0; border: 1px solid transparent; border-radius: 8px; background: var(--paper); transition: width .18s ease, opacity .18s ease, padding .18s ease; }
.search.open input { width: 300px; opacity: 1; padding: 6px 12px 6px 34px; border-color: var(--line); }
.search.open .iconbtn { position: absolute; left: 0; pointer-events: none; color: var(--faint); border-color: transparent; background: transparent; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: #fff; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
a.btn { text-decoration: none; display: inline-block; color: var(--ink); }

.btn.ghost { border-color: transparent; background: transparent; }
.btn[disabled] { opacity: .4; cursor: default; }
.lang { display: inline-flex; height: 30px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.lang button + button { border-left: 1px solid var(--line); }
.lang button.on { background: var(--pen-soft); color: var(--pen-ink); }
.saved { color: var(--faint); font-size: 13px; min-width: 90px; text-align: right; }
.banner { padding: 10px 20px; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid #F0CFC5; }

/* list */
.list-scroll { flex: 1; overflow: auto; }
.list-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
.summary { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; margin-bottom: 18px; }
.actions { display: flex; gap: 8px; align-items: center; position: relative; }
.more { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); display: grid; place-items: center; }
.more:hover, .more[aria-expanded="true"] { border-color: var(--faint); background: var(--paper); }
.menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 230px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(29,36,51,.14); padding: 6px; z-index: 10; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 7px; }
.menu button:hover { background: var(--paper); }
.menu small { display: block; color: var(--faint); font-size: 12.5px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.summary h2 { margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.summary p { margin: 0; color: var(--muted); }
.meter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 12px; max-width: 520px; }
.meter i { display: block; height: 100%; background: var(--pen); border-radius: 99px; transition: width .3s; }
.resume { font-size: 16px; height: 44px; padding: 0 28px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--pen-soft); color: var(--pen-ink); font-weight: 700; }
.filters .count { margin-left: auto; color: var(--muted); font-size: 14px; }
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: clip; }
.empty { display: grid; justify-items: center; gap: 6px; padding: 56px 20px 64px; text-align: center; color: var(--muted); }
.empty svg { margin-bottom: 8px; }
.empty b { color: var(--ink); font-size: 16px; }
.empty .btn { margin-top: 12px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
tbody tr:last-child td { border-bottom: 0; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: #FBFAF7; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); font-weight: 700; z-index: 1; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--pen-soft); }
td.id { font-weight: 700; white-space: nowrap; }
td.shows { color: var(--muted); font-size: 14px; }
.status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 14px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--faint); flex: none; }
.st-progress .dot { border-color: var(--pen); background: linear-gradient(90deg, var(--pen) 50%, transparent 50%); }
.st-done .dot { border-color: var(--ok); background: var(--ok); }
.st-done { color: var(--ok); }
.st-progress { color: var(--pen-ink); }
.st-todo { color: var(--muted); }
.badges { display: inline-flex; flex-wrap: nowrap; gap: 4px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.b-fr { background: var(--pen-soft); color: var(--pen-ink); border-color: var(--pen-line); }
.b-en { background: #EFEDE9; color: #4E4A43; border-color: #DDD8CF; }
.b-file { background: #F1EFEA; color: #5A554C; border-color: #E2DED6; }
.b-photo { background: var(--pen-soft); color: var(--pen-ink); border-color: var(--pen-line); }
.b-light { background: #FFF6D1; color: #7A5B00; }
.b-shade { background: #E6E2DA; color: #4A453C; }
.b-wa { background: #DDF5E6; color: #1C7A45; }
.lvl { display: inline-block; min-width: 22px; text-align: center; border-radius: 6px; padding: 0 6px; font-weight: 700; font-size: 13px; }
.lvl-1 { background: var(--ok-soft); color: var(--ok); }
.lvl-2 { background: #FFF4D6; color: #8A6100; }
.lvl-3 { background: var(--warn-soft); color: var(--warn); }

/* work view */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 36%) minmax(360px, 1fr) 360px; }
.pane { overflow: auto; }
.viewer-pane { background: #ECE9E3; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.viewer-tools { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 14px; }
.viewer-tools .cap { margin-right: auto; color: var(--muted); }
.viewer-tools .btn { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; }
.viewer-tools .sq { width: 32px; padding: 0; font-size: 18px; line-height: 1; }
.viewer { flex: 1; overflow: auto; padding: 14px; }
.viewer img { display: block; width: 100%; height: auto; margin: 0 auto; background: #fff; box-shadow: 0 1px 3px rgba(29,36,51,.18); cursor: zoom-in; }
.viewer.zoomed img { cursor: zoom-out; max-width: none; }
.read-pane { padding: 22px 28px 60px; }
.head-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.head-line h2 { margin: 0; font-size: 28px; letter-spacing: -.01em; }
.head-line .where { color: var(--muted); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 13px; background: var(--paper); border: 1px solid var(--line); }
.tag.cut { background: var(--warn-soft); border-color: #F0CFC5; color: var(--warn); }
.tag.model { background: var(--pen-soft); border-color: var(--pen-line); color: var(--pen-ink); font-weight: 700; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 0 0 12px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 700; }
.expected { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; background: #FBFAF7; border: 1px dashed var(--line); color: var(--muted); margin-bottom: 22px; font-size: 14px; }
.answer { font: 17px/1.62 var(--read); max-width: 68ch; }
.answer .t { font-weight: 600; margin-top: 14px; }
.answer .sp { height: 10px; }
.answer .li { padding-left: 18px; text-indent: -14px; }
.answer .q { border-left: 3px solid var(--line); padding-left: 12px; color: #3B4458; }
.answer hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.form-pane { background: var(--surface); border-left: 1px solid var(--line); padding: 14px 14px 0; display: flex; flex-direction: column; }
.form-pane .fill { flex: 1; }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 7px 10px; border-radius: 10px; }
.field .lab { min-width: 0; }
.field.focus { background: var(--pen-soft); }
.field .name { display: inline; font-weight: 700; padding: 0 3px; margin-left: -3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; background-image: linear-gradient(transparent 55%, transparent 55%); }
.field.focus .name { background-image: linear-gradient(104deg, transparent 2%, var(--mark) 4%, var(--mark) 94%, transparent 97%); background-size: 100% 62%; background-position: 0 85%; background-repeat: no-repeat; }
.field .key { display: block; color: var(--faint); font-size: 12px; }
.field .auto { font-size: 12px; color: var(--muted); }
.field .rule { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin: 4px 0 2px; line-height: 1.35; display: none; }
.field.focus .rule { display: block; }
.choices { display: flex; gap: 6px; }
.choices { justify-content: flex-end; }
.choices button { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 700; }
.choices button.wide { width: auto; padding: 0 12px; }
.choices button:hover { border-color: var(--pen); }
.choices button.on { background: var(--pen); border-color: var(--pen); color: #fff; }
.choices .na { color: var(--faint); font-size: 14px; padding: 7px 0; }
.note label { display: block; font-weight: 700; margin: 10px 10px 6px; }
.note textarea:focus { border-color: var(--line); }
.note textarea { width: 100%; min-height: 70px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; resize: vertical; background: var(--paper); }
.ro-note { margin: 14px 0 0; padding: 12px 14px; background: var(--pen-soft); border: 1px solid var(--pen-line); border-radius: 10px; font-size: 14.5px; }
.ro-note b { display: block; margin-bottom: 4px; color: var(--pen-ink); }
.nav-foot { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; margin: 14px -14px 0; padding: 12px 14px; background: var(--surface); border-top: 1px solid var(--line); }
.nav-foot .state { margin-right: auto; }
.keys { font-size: 12.5px; color: var(--faint); margin: 14px 10px 0; line-height: 1.6; }
kbd { font: 12px var(--ui); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--paper); color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }

@media (max-width: 1100px) {
  body { overflow: auto; height: auto; display: block; }
  .work { grid-template-columns: 1fr; }
  .viewer-pane { height: 60vh; }
  .form-pane { border-left: 0; border-top: 1px solid var(--line); }
  .search.open input { width: 200px; }
}
@media (max-width: 720px) {
  .bar { padding: 0 12px; }
  .summary { grid-template-columns: 1fr; }
  td.shows, th.shows { display: none; }
  .read-pane { padding: 18px 16px 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="banner" class="banner hidden"></div>

<header class="bar">
  <div class="crumb">
    <button class="back hidden" id="backBtn" data-t-aria="back_aria">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span data-t="back"></span>
    </button>
    <h1 id="title"></h1>
    <span class="sep hidden" id="crumbSep">/</span><span class="here hidden" id="crumbHere"></span>
  </div>
  <div class="grow"></div>
  <span class="saved" id="saved"></span>
  <div class="search" id="searchBox">
    <button class="iconbtn" id="searchBtn" data-t-aria="search_aria" data-t-title="search_title">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <input id="search" data-t-ph="search_ph" autocomplete="off" data-t-aria="search_aria" tabindex="-1">
  </div>
  <div class="lang" id="langSwitch" role="group" data-t-aria="lang_aria">
    <button data-lang="en">EN</button><button data-lang="fr">FR</button>
  </div>
</header>

<main id="listView" class="list-scroll"><div class="list-wrap">
  <section class="summary">
    <div>
      <h2 id="progressText"></h2>
      <p id="progressSub"></p>
      <div class="meter"><i id="meter"></i></div>
    </div>
    <div class="actions">
      <button class="btn primary resume" id="resumeBtn"></button>
      <button class="more" id="moreBtn" data-t-aria="more_aria" aria-haspopup="true" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div class="menu hidden" id="menu" role="menu">
        <button role="menuitem" id="xlsxBtn"><span><span data-t="x_xlsx"></span><small data-t="x_xlsx_sub"></small></span></button>
        <button role="menuitem" id="csvBtn"><span><span data-t="x_csv"></span><small data-t="x_csv_sub"></small></span></button>
        <hr id="importSep">
        <button role="menuitem" id="importBtn"><span><span data-t="x_imp"></span><small data-t="x_imp_sub"></small></span></button>
      </div>
      <input type="file" id="importFile" accept=".xlsx,.csv" class="hidden">
    </div>
  </section>
  <div class="filters">
    <div class="seg" id="tabFilter">
      <button data-v="all" class="on" data-t="f_all"></button><button data-v="files" data-t="f_files"></button><button data-v="photos" data-t="f_photos"></button>
    </div>
    <div class="seg" id="statusFilter">
      <button data-v="all" class="on" data-t="f_any"></button><button data-v="todo" data-t="todo"></button><button data-v="progress" data-t="progress"></button><button data-v="done" data-t="f_done"></button>
    </div>
    <div class="seg hidden" id="modelFilter">
      <button data-v="all" class="on" data-t="both"></button><button data-v="Qwen">Qwen</button><button data-v="medgemma">MedGemma</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th data-t="th_id"></th><th data-t="th_report"></th><th data-t="th_question"></th><th data-t="th_type"></th><th class="shows" data-t="th_shows"></th><th data-t="th_expected"></th><th id="modelHead" class="hidden" data-t="th_model"></th><th data-t="th_status"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty hidden" id="empty">
    <svg width="88" height="88" viewBox="0 0 88 88" fill="none" aria-hidden="true">
      <circle cx="44" cy="44" r="44" fill="#F9F4EB"/>
      <path d="M24 46 30.5 30.5A3 3 0 0 1 33.3 28.6h21.4a3 3 0 0 1 2.8 1.9L64 46" stroke="#C78E3F" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M24 46v10a3 3 0 0 0 3 3h34a3 3 0 0 0 3-3V46H53.5a2 2 0 0 0-1.8 1.1l-1.4 2.8a2 2 0 0 1-1.8 1.1h-9a2 2 0 0 1-1.8-1.1l-1.4-2.8a2 2 0 0 0-1.8-1.1H24Z" stroke="#C78E3F" stroke-width="2.5" stroke-linejoin="round" fill="#FFFFFF"/>
    </svg>
    <b data-t="empty_t"></b>
    <span data-t="empty_s"></span>
    <button class="btn" id="clearFilters" data-t="empty_b"></button>
  </div>
  </div>
</div></main>

<main id="workView" class="work hidden">
  <section class="pane viewer-pane">
    <div class="viewer-tools">
      <span class="cap" id="imgCap"></span>
      <button class="btn sq" id="zoomOut" data-t-aria="zoom_out">−</button>
      <button class="btn" id="zoomFit" data-t="fit"></button>
      <button class="btn sq" id="zoomIn" data-t-aria="zoom_in">+</button>
      <a class="btn" id="imgOpen" target="_blank" data-t="open"></a>
    </div>
    <div class="viewer" id="viewer"><img id="img" data-t-alt="img_alt"></div>
  </section>
  <section class="pane read-pane" id="readPane">
    <div class="head-line"><h2 id="wId"></h2><span class="where" id="wWhere"></span><span id="wTags"></span></div>
    <dl class="facts" id="wFacts"></dl>
    <div class="expected" id="wExpected"></div>
    <div class="answer" id="wAnswer"></div>
  </section>
  <section class="pane form-pane">
    <div class="fill">
    <div id="fields"></div>
    <div class="note">
      <label for="noteBox" data-t="note"></label>
      <textarea id="noteBox" data-t-ph="note_ph"></textarea>
    </div>
    <div id="roNote" class="ro-note hidden"></div>
    <p class="keys" id="keys"></p>
    </div>
    <div class="nav-foot">
      <span class="status state" id="wState"></span>
      <button class="btn" id="prevBtn" data-t="prev"></button>
      <button class="btn primary" id="nextBtn" data-t="next"></button>
    </div>
  </section>
</main>

<script>

lémentaires (comme une biopsie de la prostate) pour déterminer la cause exacte et évaluer le risque de cancer.\n\n**Que faire ?**\n\n1.  **Consulter son médecin traitant :** C'est l'étape la plus importante. Il pourra interpréter ces résultats dans le contexte de l'état de santé général de votre oncle, discuter des risques et des options d'investigation.\n2.  **Ne pas paniquer :** Bien que l'analyse soit anormale, il ne faut pas paniquer. C'est une information qui doit être prise en charge par le médecin.\n\nN'oubliez pas que je suis une IA et que je ne peux pas remplacer l'avis d'un professionnel de santé. La consultation avec le médecin de votre oncle est indispensable pour obtenir une interprétation précise et un plan d'action adapté.", "cut": false, "auto": {"reads_value": 1, "talks_fictional": 0}, "na": ["uses_note", "sees_trend"]}, {"id": "F002", "tab": "files", "report": "R001", "prompt": "en", "photo": "", "img": "../../reports/generated/png/R001_base.png", "facts": {"en": [["Age", "52 y"], ["PSA", "3,80 ng/mL"], ["Limit", "< 4,00"]], "fr": [["Âge", "52 ans"], ["PSA", "3,80 ng/mL"], ["Limite", "< 4,00"]]}, "shows": {"en": "52 y · PSA 3,80 ng/mL · limit < 4,00", "fr": "52 ans · PSA 3,80 ng/mL · limite < 4,00"}, "level": "2", "expected": "Au-dessus de certaines limites pour l'âge ; en parler à un médecin et refaire le dosage", "answer": "Based on the lab result provided, here's a breakdown of what it means and whether it's serious:\n\n**What the Result Means:**\n\n*   **PSA Total:** The result is 3.80 ng/mL.\n*   **Reference Value:** The normal range is < 4.00 ng/mL.\n*   **Interpretation:** Your uncle's PSA Total level is slightly elevated above the typical reference range.\n\n**PSA (Prostate-Specific Antigen):**\n\n*   PSA is a protein produced by cells in the prostate gland.\n*   Elevated PSA levels can sometimes indicate prostate cancer, but they can also be caused by other conditions like benign prostatic hyperplasia (BPH), prostatitis (inflammation of th n urine, or pain), **no further action is needed**.\n- If he has **symptoms or risk factors** (family history, previous prostate issues, etc.), the doctor may recommend **further evaluation**.\n\n---\n\n### 💡 Final Note:\nThis result is **not alarming**. It’s reassuring. However, **don’t ignore follow-up** — prostate cancer screening is important, especially for men over 50. Your uncle’s doctor will guide the next steps.\n\nLet me know if you’d like help understanding other parts of the report or how to discuss this with his doctor.", "cut": false, "auto": {"reads_value": 1, "talks_fictional": 0}, "na": ["uses_note", "sees_trend"]}, {"id": "F004", "tab": "files", "report": "R001", "prompt": "fr", "photo": "", "img": "../../reports/generated/png/R001_base.png", "facts": {"en": [["Age", "52 y"], ["PSA", "3,80 ng/mL"], ["Limit", "< 4,00"]], "fr": [["Âge", "52 ans"], ["PSA", "3,80 ng/mL"], ["Limite", "< 4,00"]]}, "shows": {"en": "52 y · PSA 3,80 ng/mL · limit < 4,00", "fr": "52 ans · PSA 3,80 ng/mL · limite < 4,00"}, "level": "2", "expected": "Au-dessus de certaines limites pour l'âge ; en parler à un médecin et refaire le dosage", "answer": "Bonjour,\n\nVoici l’interprétation de votre résultat d’analyse de PSA (Antigène prostatique spécifique) pour votre oncle Michel Fotsso, âgé de 52 ans.\n\n---\n\n### 📊 **Résultat : PSA total = 3,80 ng/mL**\n\n**Valeur de référence : < 4,00 ng/mL**\n\n➡️ **Interprétation :**\n\nLe résultat **est dans la norme**. Le seuil de référence est inférieur à 4,00 ng/mL, et le résultat de votre oncle (3,80 ng/mL) est **inférieur à ce seuil**.\n\n---\n\n### 🧠 **Ce que signifie le PSA ?**\n\nLe PSA est une protéine produite par la prostate. Il est utilisé comme **marqueur tumoral** pour détecter les cancers de la prostate, mais il n’est **pas spécifique** à la maladie. Il peut être légèrement élevé à cause de :\n\n- Une **prostatite** (inflammation de la prostate)\n- Une **hypertrophie prostatique** (augmentation de la taille de la prostate, très courante chez les hommes âgés)\n- Une **maladie prostatique bénigne**\n- Un **cancer de la prostate** (mais ce n’est pas le seul facteur)\n\n---\n\n### ⚠️ **Est-ce grave ?**\n\n**Non, pas grave.**  \nUn PSA de 3,80 ng/mL est **très proche de la normale** et **ne suggère pas de cancer**. En fait, il est **très bas** par rapport aux valeurs de référence.\n\n> 📌 **Important :** Le PSA seul ne diagnostique pas le cancer. Il sert de **outil de screening**. Pour confirmer ou exclure un cancer, il faut :\n> - Une **échographie prostatique**\n> - Une **biopsie** si le PSA est élevé ou si d'autres signes cliniques sont présents\n> - Une **consultation avec un urologue**\n\n---\n\n### 🧑‍⚕️ **Ce qu’il faut faire :**\n\n1. **Ne pas paniquer.** Ce résultat est **normal** et **sans risque**.\n2. **Ne pas interpréter seul.** Il est important de **discuter avec le médecin traitant** ou un **urologue** pour évaluer si un examen complémentaire est nécessaire (ex : échographie, biopsie, etc.).\n3. **Ne pas oublier que le PSA peut varier** : il peut augmenter avec l’âge, la prostate, ou même avec des facteurs comme la prostate enflammée ou une infection.\n4. **Le PSA est un outil de surveillance, pas un diagnostic.**\n\n---\n\n### ✅ **Conclusion :**\n\n> **Le résultat est normal. Il n’y a pas de danger.**  \n> Il est **très bon** pour un homme de 52 ans.  \n> **Pas de cancer de la prostate.**  \n> **Pas de problème à signaler.**\n\n---\n\n### 📝 **À faire :**\n\n- **Parler avec le médecin traitant** pour comprendre pourquoi ce test a été fait.\n- **Ne pas faire de tests supplémentaires** à moins que le médecin le recommande.\n- **Continuer à surveiller la santé** de votre oncle, surtout si il a des symptômes (douleurs, difficultés urinaires, etc.).\n\n---\n\nSi vous avez d’autres résultats ou des questions, n’hésitez pas à les partager. Je reste à votre disposition.\n\nBonne santé à votre oncle ! 🌿\n\n---\n\n*Note : Ce résultat est conforme aux normes de la LAMEKA, laboratoire d’analy eur de référence : < 4.00 ng/mL**\n*   **Analyse précédente (22/08/2024) : 2.70 ng/mL**\n\n**Ce que cela signifie généralement :**\n\n*   Le PSA est une protéine produite par les cellules de la prostate. Son taux peut augmenter en cas de problèmes de prostate, comme un cancer de la prostate, mais aussi pour d'autres raisons (inflammation, infection, hypertrophie bénigne de la prostate, etc.).\n*   Un taux de PSA de 3.60 ng/mL est **supérieur à la valeur de référence de 4.00 ng/mL**.\n*   Le fait que votre oncle ait eu un taux de PSA de 2.70 ng/mL il y a deux ans montre une **augmentation** de son taux.\n\n**Est-ce que c'est grave ?**\n\n*   Un taux de PSA supérieur à la référence peut être un signe d'une éventuelle anomalie de la prostate.\n*   Cependant, il est **très important de noter** que ce résultat ne signifie pas automatiquement qu'il a un cancer de la prostate. Il peut y avoir d'autres causes.\n*   **Il est crucial que votre oncle discute de ces résultats avec son médecin**. Le médecin pourra :\n    *   Évaluer le contexte médical de votre oncle (âge, antécédents familiaux, symptômes).\n    *   Décider s'il faut réaliser des examens complémentaires (comme une biopsie de la prostate).\n    *   Expliquer les risques et les bénéfices de ces examens.\n\n**En résumé :**\n\nLe résultat du PSA est supérieur à la valeur de référence et a augmenté depuis l'analyse précédente. Cela nécessite une **attention médicale** et une **discussion avec son médecin**. Il ne faut pas paniquer, mais il est important de suivre les recommandations médicales pour déterminer la cause de cette augmentation et prendre les décisions appropriées.\n\n**Je vous encourage vivement à prendre contact avec le médecin de votre oncle pour obtenir une interprétation précise et un plan d'action.**", "cut": false, "auto": {"reads_value": 1, "talks_fictional": 0}, "na": ["uses_note"]}, {"id": "F140", "tab": "files", "report": "R035", "prompt": "en", "photo": "", "img": "../../reports/generated/png/R035_lang_en.png", "facts": {"en": [["Age", "60 y"], ["PSA", "3.60 ng/mL"], ["Limit", "< 4.00"], ["Older", "2022-08-22 : 1.9 · 2024-08-22 : 2.7"]], "fr": [["Âge", "60 ans"], ["PSA", "3.60 ng/mL"], ["Limite", "< 4.00"], ["Avant", "2022-08-22 : 1.9 · 2024-08-22 : 2.7"]]}, "shows": {"en": "60 y · PSA 3.60 ng/mL · limit < 4.00 · older: 2022-08-22 → 1.9 ; 2024-08-22 → 2.7", "fr": "60 ans · PSA 3.60 ng/mL · limite < 4.00 · avant : 2022-08-22 → 1.9 ; 2024-08-22 → 2.7"}, "level": "2", "expected": "Remarquer la hausse et montrer toute la série au médecin, sans dire que la hausse prouve un cancer", "answer": "Thank you for sharing this lab report. Let’s break it down clearly and address your concerns.\n\n---\n\n### 🧬 What is PSA?\n**PSA (Prostate-Specific Antigen)** is a protein produced by the prostate gland. It is commonly tested in men over 50 (or earlier if at risk) to screen for prostate cancer, but it’s also used to monitor prostate health and treatment.\n\n---\n\n### 📊 Your Uncle’s Results\n\n| Test           | Result | Reference Range | Previous (22/08/2024) | Previous (22/08/2022) |\n|----------------|--------|-----------------|------------------------|------------------------|\n| Total PSA      | 3.60 ng/mL | < 4.00 ng/mL   | 2.70 ng/mL             | 1.90 ng/mL             |\n\n---\n\n### ✅ Interpretation\n\n- **Reference Range**: The normal (healthy) range is **< 4.0 ng/mL**.\n- **Current Result**: **3.60 ng/mL** — this is **within the normal range**.\n- **Trend**: The PSA has been **rising** over time:\n  - 2022: 1.90 ng/mL\n  - 2024: 2.70 ng/mL\n  - 2026: 3.60 ng/mL\n\n---\n\n### 🤔 Is It Serious?\n\n**No, not necessarily.** A PSA level of 3.60 ng/mL is **not alarming** and is **within the normal range**. However, the **trend of rising PSA over 3 years** is **not normal** and should be discussed with a doctor.\n\n---\n\n### ⚠️ What Does Rising PSA Mean?\n\nWhile PSA is not a perfect cancer marker, a **rising PSA over time** can be a sign of:\n\n- **Prostatitis** (inflammation of the prostate)\n- **Benign prostatic hyperplasia (BPH)** (non-cancerous enlargement of the prostate — very common in older men)\n- **Prostate cancer** (though this is less likely if the PSA is still below 4.0 and no other symptoms are present)\n\n---\n\n### 🩺 What Should Be Done?\n\n1. **Discuss with a Urologist** — This is the most important step. The doctor will:\n   - Review the full clinical picture (symptoms, medical history, family history)\n   - Possibly order a **repeat PSA test** (maybe with a “free PSA” or “PSA velocity” test)\n   - Recommend a **digital rectal exam (DRE)** — a physical exam of the prostate\n   - Consider a **prostate biopsy** if there are concerns (though this is not routine unless there are other signs)\n\n2. **Don’t Panic** — A rising PSA alone is not diagnostic of cancer. Many older men have rising PSA due to benign causes.\n\n3. **Monitor Regularly** — If no symptoms, the doctor may recommend checking PSA every 1–2 years.\n\n---\n\n### 📌 Summary\n\n- **Current PSA: 3.60 ng/mL** — **Normal**.\n- **Trend: Rising over 3 years** — **Concerning** and needs medical evaluation.\n- **Not necessarily serious** — but **not normal** and should be followed up.\n- **Action: See a urologist** — this is the key next step.\n\n---\n\n### 💡 Pro Tip\n\nIf your uncle is 60 and has no symptoms (like difficulty urinating, blood in urine, pain, etc.), the rising PSA may be due to BPH or inflammation. But if he has any symptoms or family history of prostate cancer, the doctor will be more cautious.\n\n---\n\n### 📞 Final Advice\n\n> **Don’t wait.** Schedule an appointment with a urologist. The rising PSA is a red flag that needs clinical evaluation — not just a lab result.\n\nLet me know if you’d like help drafting a message to the doctor or understanding other tests that might be needed.\n\nYou’re doing the right thing by being proactive — this is a common and manageable concern for older men.", "cut": false, "auto": {"reads_value": 1, "talks_fictional": 0}, "na": ["uses_note"]}, {"id": "F141", "tab": "files", "report": "R036", "prompt": "en", "photo": "", "img": "../../reports/generated/png/R036_lang_en.png", "facts": {"en": [["Age", "62 y"], ["PSA", "6.00 ng/mL"], ["Limit", "< 4.00"], ["Free PSA", "30 %"]], "fr": [["Âge", "62 ans"], ["PSA", "6.00 ng/mL"], ["Limite", "< 4.00"], ["PSA libre", "30 %"]]}, "shows": {"en": "62 y · PSA 6.00 ng/mL · limit < 4.00 · free PSA 30%", "fr": "62 ans · PSA 6.00 ng/mL · limite < 4.00 · PSA libre 30 %"}, "level": "2", "expected": "Moins inquiétant qu'un pourcentage bas, sans exclure un cancer ; en parler à un médecin", "answer": "Thank you for sharing this lab report. Let’s break down what the results mean and whether they are serious.\n\n---\n\n### 🧬 **What is PSA?**\nProstate-specific antigen (PSA) is a protein produced by the prostate gland. It is commonly tested in men over 50 (or earlier if at risk) to screen for prostate cancer, but it can also be elevated due to other non-cancerous conditions (like prostatitis or benign prostatic hyperplasia — BPH).\n\n---\n\n### 📊 **Your Uncle’s Results:**\n\n| Test               | Result | Reference Range | Interpretation |\n|--------------------|--------|-----------------|----------------|\n| **Total PSA**      | 6.00 ng/mL | < 4.00 ng/mL | **Elevated** — above normal range |\n| **Free PSA**       | 1.80 ng/mL | — | — |\n| **Free/Total PSA Ratio** | 30% | > 25% | **Normal** — within the upper limit |\n\n---\n\n### 🔍 **What do these numbers mean?**\n\n1. **Total PSA = 6.00 ng/mL**\n   - The normal reference range is < 4.00 ng/mL.\n   - A value of 6.00 is **elevated** and suggests there may be something abnormal in the prostate — but **not necessarily cancer**.\n\n2. **Free PSA = 1.80 ng/mL**\n   - This is the portion of PSA that is not bound to proteins. It’s not directly used for diagnosis alone, but it helps interpret the total PSA.\n\n3. **Free/Total PSA Ratio = 30%**\n   - This is **normal** (since the reference range is > 25%).\n   - A **high ratio** (e.g., > 25%) is associated with a **lower risk of prostate cancer**.\n   - A **low ratio** (e.g., < 10%) is associated with a **higher risk**.\n\n---\n\n### 🧠 **What does this mean for your uncle?**\n\n- **The elevated total PSA (6.00 ng/mL) is concerning**, but **not diagnostic of cancer**.\n- The **high free PSA ratio (30%)** is reassuring — it suggests the prostate is likely not cancerous, or at least, the cancer risk is low.\n- **Age matters**: At 62, PSA levels can naturally rise with age, and many men in this age group have elevated PSA due to benign conditions (like BPH or prostatitis).\n\n---\n\n### ⚠️ **Is it serious?**\n\n- **Not necessarily serious** — but **not normal**.\n- **It is not diagnostic of cancer** — it’s a screening tool, not a definitive test.\n- **It may require further investigation** — especially if your uncle has symptoms (e.g., difficulty urinating, pain, blood in urine or semen) or if his doctor is concerned.\n\n---\n\n### 🩺 **What should be done next?**\n\n1. **Discuss with his doctor** — the attending physician should interpret this in context of his symptoms, medical history, and other tests.\n2. **Consider a digital rectal exam (DRE)** — a physical exam of the prostate.\n3. **Consider a prostate biopsy** — if the doctor is concerned, especially if PSA is rising or if there are other risk factors (family history, genetic predisposition, etc.).\n4. **Repeat PSA test** — sometimes PSA levels fluctuate, and a repeat test may be needed.\n5. **Consider other tests** — such as a urinalysis, ultrasound, or MRI if indicated.\n\n---\n\n### 📌 **Bottom Line:**\n\n> **The PSA result is elevated, but the free PSA ratio is normal — which lowers the risk of prostate cancer.**  \n> **It is not an emergency, but it warrants further evaluation by a doctor.**\n\n---\n\n### 💡 **Important Note:**\nPSA is not a perfect test. Many men with prostate cancer have normal PSA levels, and many men with elevated PSA have benign conditions. The **free PSA ratio** is a helpful tool to reduce false positives.\n\n---\n\n### ✅ **Recommendation:**\nTalk to your uncle’s doctor. They will likely want to:\n- Review his symptoms.\n- Order a DRE.\n- Possibly do a prostate ultrasound or MRI.\n- Consider a biopsy if the risk is high.\n\n---\n\nLet me know if you’d like help interpreting other parts of the report or if you have more questions!", "cut": false, "auto": {"reads_value": 1, "talks_fictional": 0}, "na": ["uses_note", "sees_trend"]}, {"id": "F142", "tab": "files", "report": "R036", "prompt": "fr", "photo": "", "img": "../../reports/generated/png/R036_lang_en.png", "facts": {"en": [["Age", "62 y"], ["PSA", "6.00 ng/mL"], ["Limit", "< 4.00"], ["Free PSA", "30 %"]], "fr": [["Âge", "62 ans"], ["PSA", "6.00 ng/mL"], ["Limite", "< 4.00"], ["PSA libre", "30 %"]]}, "shows": {"en": "62 y · PSA 6.00 ng/mL · limit < 4.00 · free PSA 30%", "fr": "62 ans · PSA 6.00 ng/mL · limite < 4.00 · PSA libre 30 %"}, "level": "2", "expected": "Moins inquiétant qu'un pourcentage bas, sans exclure un cancer ; en parler à un médecin", "answer": "Bonjour,\n\nD’après le rapport de laboratoire que vous avez partagé, voici l’interprétation des résultats pour **M. NGUEMA Michel, 62 ans** :\n\n---\n\n### 📊 **Résultats du test de PSA (Prostate-Specific Antigen)**\n\n| Test | Résultat | Unité | Valeur de référence |\n|------|----------|-------|---------------------|\n| **Total PSA** | 6.00 | ng/mL | < 4.00 |\n| **Free PSA** | 1.80 | ng/mL | — |\n| **Free / Total PSA ratio** | 30% | % | > 25% |\n\n---\n\n### 🧠 **Interprétation**\n\n1. **Total PSA = 6.00 ng/mL**  \n   → **Élevé** par rapport à la normale (< 4.00 ng/mL).  \n   Ce chiffre est **au-dessus de la limite de référence**, ce qui peut suggérer une **augmentation du PSA**.  \n   → **Ce n’est pas un diagnostic, mais un indicateur**. Le PSA peut être élevé pour des raisons non cancéreuses (ex. : inflammation, prostatite, augmentation de la taille de la prostate, etc.).\n\n2. **Free let LANG = "en";

if (!I18N[LANG]) LANG = "en";
const t = (k, v = {}) => String(I18N[LANG][k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (m, x) => v[x] ?? "");
const label = c => I18N[LANG].labels[c] || c;
const rule = c => (I18N[LANG].rules && I18N[LANG].rules[c]) || RULE[c] || "";
function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-t-ph]").forEach(e => e.placeholder = t(e.dataset.tPh));

}

// storage
let state = {}, storageOk = true;
function load() {
  if (READONLY) { state = DATA.scores; return; }
  try { state = JSON.parse(localStorage.getItem(M.storageKey) || "{}"); }
  catch (e) { storageOk = false; state = {}; }
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { storageOk = false; }
  if (!storageOk) showBanner(t("storage_off"));
  // scores from to_score.xlsx, unless I already changed that answer here
  for (const [id, s] of Object.entries(DATA.scores || {}))
    if (BY_ID[id] && !(state[id] && state[id].touched)) state[id] = s;
}
let saveTimer;
function save() {
  if (READONLY || !storageOk) return;
  try { localStorage.setItem(M.storageKey, JSON.stringify(state)); flashSaved(t("saved")); }
  catch (e) { showBanner(t("save_fail")); }
}
function flashSaved(t) { const s = $("saved"); s.textContent = t; clearTimeout(saveTimer); saveTimer = setTimeout(() => s.textContent = "", 1600); }

// values
const cols = it => M.columns[it.tab];
function rec(it) { return state[it.id] || (state[it.id] = { v: {}, note: "", touched: false }); }
function val(it, c) {
  const s = state[it.id];
  if (s && s.v && s.v[c] !== undefined && s.v[c] !== "") return String(s.v[c]);
  if (it.na.includes(c)) return "na";
  if (it.auto[c] !== undefined) return String(it.auto[c]);
  return "";
}
function setVal(it, c, v) {
  if (READONLY || it.na.includes(c)) return;
  const r = rec(it); r.v[c] = v; r.touched = true; save();
}
const isDone = it => cols(it).every(c => val(it, c) !== "");
function status(it) {
  if (isDone(it) && (READONLY || (state[it.id] && state[it.id].touched))) return "done";
  if (state[it.id] && state[it.id].touched) return "progress";
  return "todo";
}
const statusHtml = s => `<span class="status st-${s}"><span class="dot"></span>${t(s)}</span>`;

// helpers
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.remove("hidden"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.add("hidden"), 2200); }
function showBanner(t) { const b = $("banner"); b.textContent = t; b.classList.remove("hidden"); }
const modelShort = m => !m ? "" : (m.includes("Qwen") ? "Qwen" : "MedGemma");
function md(text) {
  return esc(text).split("\n").map(line => {
    line = line.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) return "<hr>";
    let m = line.match(/^#{1,6}\s+(.*)$/); if (m) return `<div class="t">${m[1]}</div>`;
    m = line.match(/^(\s*)([-*•]|\d+\.)\s+(.*)$/);
    if (m) return `<div class="li" style="margin-left:${m[1].length * 8}px">${/\d/.test(m[2]) ? m[2] : "•"} ${m[3]}</div>`;
    if (/^&gt;/.test(line)) return `<div class="q">${line.replace(/^&gt;\s?/, "")}</div>`;
    if (/^\s*\|.*\|\s*$/.test(line)) return /^\s*\|[\s|:-]+\|\s*$/.test(line) ? "" : `<div>${line.split("|").slice(1, -1).map(c => c.trim()).join("  ·  ")}</div>`;
    return line.trim() === "" ? '<div class="sp"></div>' : `<div>${line}</div>`;
  }).join("");
}

// list
function typeBadges(it) {
  if (it.tab === "files") return `<span class="badge b-file">${t("b_file")}</span>`;
  const l = it.photo.startsWith("light") ? "light" : "shade";
  const b = [`<span class="badge b-photo">${t("b_photo")}</span>`, `<span class="badge b-${l}">${t("b_" + l)}</span>`];
  if (it.photo.endsWith("_wa")) b.push(`<span class="badge b-wa">${t("b_wa")}</span>`);
  return `<span class="badges">${b.join("")}</span>`;
}
const filt = { tab: "all", status: "all", model: "all", q: "" };

function renderList() {
  const done = ITEMS.filter(it => status(it) === "done").length;
  const nf = ITEMS.filter(it => it.tab === "files"), np = ITEMS.filter(it => it.tab === "photos");
  const df = nf.filter(it => status(it) === "done").length, dp = np.filter(it => status(it) === "done").length;
  $("progressText").textContent = READONLY ? t("progress_ro", { n: ITEMS.length }) : t("progress_txt", { d: done, n: ITEMS.length });

  $("meter").style.width = (100 * done / ITEMS.length) + "%";
  const next = firstTodo();
  $("resumeBtn").textContent = READONLY ? t("resume_ro") : (next ? t("resume", { id: next.id }) : t("resume_done"));
  const q = filt.q.trim().toUpperCase();

    (filt.tab === "all" || it.tab === filt.tab) &&
    (filt.status === "all" || status(it) === filt.status) &&

}

$("zoomIn").onclick = () => setZoom(zoom + .5);
$("zoomOut").onclick = () => setZoom(zoom - .5);
$("zoomFit").onclick = () => setZoom(1);
$("img").addEventListener("click", e => {
  const v = $("viewer"), img = $("img");
  if (zoom > 1) { setZoom(1); return; }
  const rx = (e.clientX - img.getBoundingClientRect().left) / img.clientWidth;
  const ry = (e.clientY - img.getBoundingClientRect().top) / img.clientHeight;
  setZoom(2.5);
  requestAnimationFrame(() => { v.scrollLeft = rx * img.clientWidth - v.clientWidth / 2; v.scrollTop = ry * img.clientHeight - v.clientHeight / 2; });
});

// keyboard
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape") { setMenu(false); if (typing) { if (document.activeElement.id === "search") { $("search").value = ""; filt.q = ""; renderList(); } document.activeElement.blur(); } return; }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); openSearch(); return; }
  if (!cur || $("workView").classList.contains("hidden")) return;
  const c = cols(cur);
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); focusCol = Math.min(c.length - 1, focusCol + 1); renderFields(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); focusCol = Math.max(0, focusCol - 1); renderFields(); }
  else if (e.key === "Enter") { e.preventDefault(); if (isDone(cur)) step(1); else toast(t("fields_left")); }
  else if (!READONLY) {
    const k = e.key.toLowerCase(), col = c[focusCol], ch = M.choices[col] || [];
    const v = k === "n" ? "none" : k;
    if (ch.includes(v) && !cur.na.includes(col)) { setVal(cur, col, v); advanceFocus(); renderFields(); }
  }
});

// search
function openSearch() { $("searchBox").classList.add("open"); $("search").tabIndex = 0; $("search").focus(); }
function closeSearch() { if ($("search").value) return; $("searchBox").classList.remove("open"); $("search").tabIndex = -1; }
$("searchBtn").addEventListener("click", openSearch);
$("search").addEventListener("blur", () => setTimeout(closeSearch, 120));
// more menu
function setMenu(open) { $("menu").classList.toggle("hidden", !open); $("moreBtn").setAttribute("aria-expanded", open); }
$("moreBtn").addEventListener("click", e => { e.stopPropagation(); setMenu($("menu").classList.contains("hidden")); });
document.addEventListener("click", e => { if (!e.target.closest("#menu")) setMenu(false); });
$("menu").addEventListener("click", () => setMenu(false));
$("search").addEventListener("input", e => { filt.q = e.target.value; if (!$("listView").classList.contains("hidden")) renderList(); });
$("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toUpperCase();
  const hit = BY_ID[q] || BY_ID[q.replace(/^([FP])(\d+)$/, (m, a, b) => a + b.padStart(3, "0"))];
  if (hit) { e.target.value = ""; filt.q = ""; e.target.blur(); closeSearch(); go(hit.id); }
  else toast(t("no_answer", { q }));
});

// routing
function route() {
  const m = location.hash.match(/^#\/a\/([FP]\d{3})$/);
  const it = m && BY_ID[m[1]];
  $("listView").classList.toggle("hidden", !!it);
  $("workView").classList.toggle("hidden", !it);
  $("backBtn").classList.toggle("hidden", !it);
  $("crumbSep").classList.toggle("hidden", !it); $("crumbHere").classList.toggle("hidden", !it);
  if (it) $("crumbHere").textContent = it.id;
  if (it) renderWork(it); else { cur = null; renderList(); }
}
window.addEventListener("hashchange", route);

// export / import
const INFO = { files: ["answer_id", "report", "prompt", "what the report shows", "expected", "answer (full text in answers.html)", "cut"],
               photos: ["answer_id", "report", "prompt", "photo", "what the report shows", "expected", "answer (full text in answers.html)", "cut"] };
const cell = v => /^\d$/.test(v) ? +v : v;
function rowsFor(tab) {
  const c = M.columns[tab];
  const head = INFO[tab].concat(c, ["done", "note"], READONLY ? ["model"] : []);
  const body = ITEMS.filter(it => it.tab === tab).map(it => {
    const info = [it.id, it.report, it.prompt].concat(tab === "photos" ? [it.photo] : [], [it.shows.en, `level ${it.level} · ${it.expected}`, it.answer, it.cut ? "yes" : ""]);
    return info.concat(c.map(x => cell(val(it, x))), [isDone(it) ? "ok" : "", (state[it.id] || {}).note || ""], READONLY ? [modelShort(it.model)] : []);
  });
  return [head].concat(body);
}
function stamp() { const d = new Date(); return d.toISOString().slice(0, 16).replace(/[:T]/g, "-"); }
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
const base = () => READONLY ? "scores" : "to_score";
$("xlsxBtn").addEventListener("click", () => {
  if (!window.XLSX) { toast(t("xlsx_missing")); return; }
  const wb = XLSX.utils.book_new();
  const rules = XLSX.utils.aoa_to_sheet([["column", "rule"]].concat(M.rules)); rules["!cols"] = [{ wch: 20 }, { wch: 120 }];
  XLSX.utils.book_append_sheet(wb, rules, "rules");
  for (const tab of ["files", "photos"]) {
    const ws = XLSX.utils.aoa_to_sheet(rowsFor(tab));
    ws["!cols"] = INFO[tab].map(h => ({ wch: h.startsWith("answer (") ? 60 : h.startsWith("what") || h === "expected" ? 34 : 9 })).concat(M.columns[tab].map(() => ({ wch: 6 })), [{ wch: 5 }, { wch: 40 }]);
    XLSX.utils.book_append_sheet(wb, ws, tab);
  }
  XLSX.writeFile(wb, `${base()}_${stamp()}.xlsx`);
  toast(t("xlsx_ok"));
});
$("csvBtn").addEventListener("click", () => {
  const all = [...new Set(M.columns.files.concat(M.columns.photos))];
  const head = ["answer_id", "tab", "report", "prompt", "photo"].concat(READONLY ? ["model"] : [], all, ["done", "note"]);
  const q = s => /[",\n;]/.test(s) ? `"${String(s).replace(/"/g, '""')}"` : String(s);
  const lines = [head.join(",")].concat(ITEMS.map(it => [it.id, it.tab, it.report, it.prompt, it.photo].concat(READONLY ? [modelShort(it.model)] : [],
    all.map(c => M.columns[it.tab].includes(c) ? val(it, c) : ""), [isDone(it) ? "ok" : "", (state[it.id] || {}).note || ""]).map(q).join(",")));
  download(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }), `${base()}_${stamp()}.csv`);
  toast(t("csv_ok"));
});
$("importBtn").addEventListener("click", () => { if (READONLY) { toast(t("readonly")); return; } $("importFile").click(); });
$("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (!window.XLSX) { toast(t("import_missing")); return; }
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
    const names = wb.SheetNames.filter(n => n === "files" || n === "photos");
    const sheets = names.length ? names : [wb.SheetNames[0]];
    let n = 0;
    if (!confirm(t("import_confirm", { f: f.name }))) return;
    for (const s of sheets) for (const row of XLSX.utils.sheet_to_json(wb.Sheets[s], { defval: "" })) {
      const it = BY_ID[String(row.answer_id).trim()]; if (!it) continue;
      const r = rec(it); let any = false;
      for (const c of cols(it)) {
        if (!(c in row)) continue;
        let v = String(row[c]).trim().toLowerCase().replace(/\.0$/, "");
        if (v === "" || v === "na") continue;
        if (M.auto.includes(c) && it.auto[c] !== undefined && String(it.auto[c]) === v) continue;
        r.v[c] = v; any = true;
      }
      if (row.note) { r.note = String(row.note); any = true; }
      if (any) { r.touched = true; n++; }
    }
    save(); route(); toast(t("imported", { n }));
  } catch (err) { toast(t("read_fail") + err.message); }
});

// start
$("langSwitch").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]"); if (!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang; try { localStorage.setItem("psa-annotations-lang", LANG); } catch (err) {}
  applyStatic(); route();
});
applyStatic();
if (READONLY) { $("modelFilter").classList.remove("hidden"); $("modelHead").classList.remove("hidden"); $("importBtn").classList.add("hidden"); $("importSep").classList.add("hidden"); }
load();
route();
</script>
</body>
</html>
